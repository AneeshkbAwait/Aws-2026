name: "To manage AWS Ec2 infrastructure - apply"

on:
  push:
    branches: 
      - "master"
    paths:
      - "tfmp-codes/**"

jobs:
  deploy:
    runs-on: "ubuntu-latest"

    defaults:
      run:
        working-directory: tfmp-codes/vm-deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.TF_VAR_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.TF_VAR_AWS_SECRET }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform int
        run: terraform init

      - name: Terraform Plan
        run: |
          |
          terraform plan -no-color -out=tfplan

          terraform show -no-color tfplan > terraform-plan.txt

          {
            echo "# AWS EC2 Infrastructure - Terraform Apply"
            echo ""
            echo "## Terraform Plan"
            echo ""
            echo '```terraform'
            cat terraform-plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        run: |
          terraform apply -no-color --auto-approve tfplan

          {
            echo ""
            echo "## Terraform Apply Results"
            echo ""
            echo "<badge>SUCCESS</badge>"
            echo ""
            echo "Terraform apply completed successfully!"
            echo ""
            echo "**AWS Region:** ap-south-1"
            echo ""
            echo "### Apply Output"
            echo ""
            echo '```terraform'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
    