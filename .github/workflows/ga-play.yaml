name: "Aneesh - Github actions play"

#First example tried

# eg for printing few Github avaiable environment variables, usage of $GITHUB_ENV (for variables to be avaialble on other steps in the same Job) &
# $GITHUB_OUTPUT - to make variable available to other steps in the same job, and to other Jobs as well. 

on:
  workflow_dispatch:
  #push:
    # branches:
    #   - master

# define global variables
env:
  PROJECT_NAME: "zomato-project - global var"
  ENVIRONMENT: "development  - global var"

jobs:

  build_job:
    name: "aneesh - build job- job1"
    runs-on: ubuntu-latest
    # define job level variables
    env:
      APP_NAME: "zomato-app - build job var"
    outputs:
      APP_VER: ${{ steps.set_version.outputs.VERSION }}
      test: ${{ steps.set_version.outputs.TEST_OT }}
    steps:
      
    - name: "step1 - print common github variable"
      run: |
        echo "Hello - I am printing common GitHub variables"
        echo "Repository: $GITHUB_REPOSITORY"
        echo "Branch: $GITHUB_REF_NAME"
        echo "Commit SHA: $GITHUB_SHA"
        echo "Actor: $GITHUB_ACTOR"
        echo "Runner OS: $RUNNER_OS"
        echo "Project: $PROJECT_NAME"
        echo "Environment: $ENVIRONMENT"
        echo "App Name: $APP_NAME"

    - name: "step2 - set app version variable"
      run: |
        echo "APP_VERSION=1.1.0" >> $GITHUB_ENV
        echo "Variable created -> APP_VESRION"

        echo "APP_MOD=python" >> $GITHUB_ENV
        echo "Variable created -> APP_MOD"

    - name: "step3 - Print app version"
      run: |
        echo "Project: $PROJECT_NAME"
        echo "Environment: $ENVIRONMENT"
        echo "App name: $APP_NAME"
        echo "App Version: $APP_VERSION"
        echo "App module: $APP_MOD"

    - name: "step4 - setting variable output for next job"
      id: set_version
      run: |
        echo "version=$APP_VERSION" >> $GITHUB_OUTPUT
        echo "Output variable created -> VERSION"
        echo "TEST_OT=Job1" >> $GITHUB_OUTPUT
        echo "Job variable created -> TEST_OT"

  deploy_job:
    name: "aneesh - deploy job -job2"
    runs-on: ubuntu-latest
    needs: build_job

    steps:
    - name: "job2 - step1 - read output variable"
      run: |
        echo "Project name: $PROJECT_NAME"
        echo "Environment: $ENVIRONMENT"
        echo "App Version: ${{ needs.build_job.outputs.APP_VER }}"
        echo "---------------------------------------------"
        echo "Github Repo: $GITHUB_REPOSITORY"
        echo "test value: ${{ needs.build_job.outputs.test}}"