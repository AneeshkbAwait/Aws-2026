name: "Aneesh - Play with Github Actions"

on:
  workflow_dispatch

env:
  project: zomato
  environment: dev

jobs:

  build_job:
    name: "build job - job1"
    runs-on: ubuntu-latest
    env:
      app: ui-app
    outputs:
      app_ver: ${{ steps.step4.outputs.app_version }}
    steps:
    - name: "step1 - printing some github variables"
      env:
        step1: hi-step1
      run: |
        echo "Repo: $GITHUB_REPOSITORY"
        echo "Branch: $GITHUB_REF_NAME"
        echo "Project: $project"
        echo "step1 value: $step1"

    - name: "step2 - set step variable for next steps"
      run: |
        echo "app_version=1.0.0" >> $GITHUB_ENV

    - name: "step3 - accessing the previous step variable"
      run: |
        echo "app: $app"
        echo "app version: $app_version"

    - name: "step4 - passing variables for next stage"
      id: step4
      run: |
        echo "version=$app_version" >> $GITHUB_OUTPUT
        echo "output environment passed for next job"

  deploy_job:
    name: "Aneesh - deploying job"
    runs-on: ubuntu-latest
    needs: build_job
    steps:
    - name: "deploy step1 - reading previous job variable"
      run: |
        echo "project: $project"
        echo "app version: ${{ needs.build_job.outputs.app_ver }}"